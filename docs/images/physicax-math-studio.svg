  <text x="150" y="126" fill="#7dd3fc" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">PhysicaX Math Studio</text>
  <text x="150" y="180" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="800">A MATLAB-inspired layer for symbolic, visual, and numerical work</text>
  <text x="150" y="226" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="24">Command-window style algebra, graphing, ODE exploration, units, scaling, and physics-aware validation in one product surface.</text>

  <rect x="150" y="268" width="1100" height="500" rx="30" fill="url(#pane)" stroke="#294a70"/>
  <rect x="184" y="302" width="472" height="406" rx="24" fill="#091426" stroke="#284867"/>
  <rect x="720" y="302" width="496" height="188" rx="24" fill="#0d1c31" stroke="#31587f"/>
  <rect x="720" y="520" width="496" height="188" rx="24" fill="#0c182a" stroke="#31587f"/>

  <circle cx="216" cy="334" r="7" fill="#fb7185"/>
  <circle cx="238" cy="334" r="7" fill="#fbbf24"/>
  <circle cx="260" cy="334" r="7" fill="#34d399"/>
  <text x="288" y="340" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="18">Command Window</text>

  <text x="210" y="386" fill="#7dd3fc" font-family="Courier New, monospace" font-size="21">fx&gt; simplify(sin(x)^2 + cos(x)^2)</text>
  <text x="210" y="420" fill="#f8fafc" font-family="Courier New, monospace" font-size="21">ans = 1</text>
  <text x="210" y="468" fill="#7dd3fc" font-family="Courier New, monospace" font-size="21">fx&gt; solve(x^3 - 2*x - 5 == 0, x)</text>
  <text x="210" y="502" fill="#f8fafc" font-family="Courier New, monospace" font-size="21">x ~= 2.09455</text>
  <text x="210" y="550" fill="#7dd3fc" font-family="Courier New, monospace" font-size="21">fx&gt; Matrix([[1,2],[3,4]]).eigenvals()</text>
  <text x="210" y="584" fill="#f8fafc" font-family="Courier New, monospace" font-size="21">lambda = 5.372, -0.372</text>
  <text x="210" y="644" fill="#93c5fd" font-family="Arial, Helvetica, sans-serif" font-size="18">Symbolic algebra, limits, units, and matrices stay in the same workspace.</text>

  <text x="752" y="340" fill="#a7f3d0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Graphing + intuition</text>
  <path d="M766 458H1168" stroke="#26445f" stroke-width="2"/>
  <path d="M790 360V456" stroke="#26445f" stroke-width="2"/>
  <path d="M790 430C826 390 845 368 882 368C923 368 933 434 973 434C1009 434 1027 334 1065 334C1098 334 1122 384 1150 412" stroke="url(#chart)" stroke-width="7" stroke-linecap="round"/>
  <text x="760" y="398" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="17">Turn equations into visual explanations quickly.</text>

  <text x="752" y="558" fill="#fde68a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">ODE workbench + diagnostics</text>
  <text x="760" y="602" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="18">y'' = -k*y - c*v</text>
  <text x="760" y="632" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="18">params = { k: 1.0, c: 0.1 }</text>
  <text x="760" y="662" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="18">outputs: displacement, velocity, period</text>
  <rect x="1020" y="570" width="160" height="42" rx="16" fill="#123454"/>
  <text x="1043" y="597" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Stable model</text>
  <rect x="1020" y="626" width="160" height="42" rx="16" fill="#173b35"/>
  <text x="1048" y="653" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Plot-backed</text>
  <text x="150" y="810" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="22">Best paired with:</text>
  <text x="328" y="810" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="22">graphing, CAS, linear algebra, scaling, units, optimization, sensitivity</text>
