    <linearGradient id="chart" x1="880" y1="298" x2="1130" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="860" rx="40" fill="url(#mathBg)"/>
  <circle cx="1180" cy="140" r="170" fill="#2563eb" fill-opacity="0.12"/>
