      <stop stop-color="#08111f"/>
      <stop offset="0.55" stop-color="#12243f"/>
      <stop offset="1" stop-color="#14253a"/>
    </linearGradient>
    <linearGradient id="pane" x1="170" y1="210" x2="1210" y2="730" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12243e"/>
      <stop offset="1" stop-color="#0d1728"/>
