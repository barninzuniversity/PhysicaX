<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081224"/>
      <stop offset="1" stop-color="#161C44"/>
    </linearGradient>
    <linearGradient id="panel" x1="92" y1="124" x2="1194" y2="812" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#EEF4FF"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1298" cy="148" r="240" fill="#60A5FA" fill-opacity="0.16"/>
  <circle cx="1422" cy="702" r="284" fill="#C084FC" fill-opacity="0.12"/>

  <rect x="78" y="88" width="1048" height="724" rx="38" fill="url(#panel)"/>
  <rect x="79" y="89" width="1046" height="722" rx="37" stroke="#D8E7FF"/>

  <text x="132" y="178" fill="#2563EB" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="4.2">LINUX DESKTOP GUIDE</text>
  <text x="132" y="262" fill="#081121" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800">Run PhysicaX like a real</text>
  <text x="132" y="330" fill="#081121" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800">local product.</text>
  <text x="132" y="388" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="25">The desktop app bundles the mirrored web UI, backend visibility, GPU policy control,</text>
  <text x="132" y="424" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="25">and Linux-friendly launch paths for both source checkouts and packaged releases.</text>

  <g>
    <rect x="132" y="482" width="436" height="116" rx="28" fill="#0D1830"/>
    <text x="164" y="530" fill="#7DD3FC" font-family="Consolas, Menlo, monospace" font-size="22">npm run desktop:doctor:linux</text>
    <text x="164" y="570" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="22">Check tools, builds, backend artifacts, and release files.</text>

    <rect x="132" y="622" width="436" height="116" rx="28" fill="#0D1830"/>
    <text x="164" y="670" fill="#7DD3FC" font-family="Consolas, Menlo, monospace" font-size="22">npm run desktop:run:linux</text>
    <text x="164" y="710" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="22">Build the runtime stack and launch Electron on Linux.</text>
  </g>

  <g>
    <rect x="606" y="482" width="468" height="256" rx="28" fill="#F8FBFF"/>
    <rect x="606.75" y="482.75" width="466.5" height="254.5" rx="27.25" stroke="#D5E3FF"/>
    <text x="642" y="530" fill="#2563EB" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2">RECOMMENDED SOURCE FLOW</text>
    <text x="642" y="584" fill="#081121" font-family="Consolas, Menlo, monospace" font-size="20">python3 -m venv .venv</text>
    <text x="642" y="618" fill="#081121" font-family="Consolas, Menlo, monospace" font-size="20">source .venv/bin/activate</text>
    <text x="642" y="652" fill="#081121" font-family="Consolas, Menlo, monospace" font-size="20">pip install -r requirements.txt</text>
    <text x="642" y="686" fill="#081121" font-family="Consolas, Menlo, monospace" font-size="20">cd physicax-desktop</text>
    <text x="642" y="720" fill="#081121" font-family="Consolas, Menlo, monospace" font-size="20">npm run desktop:doctor:linux</text>
  </g>

  <g>
    <rect x="1170" y="118" width="352" height="672" rx="38" fill="#0E172B"/>
    <rect x="1171" y="119" width="350" height="670" rx="37" stroke="rgba(191,219,254,0.18)"/>
    <rect x="1272" y="166" width="148" height="148" rx="34" fill="#071121"/>
    <ellipse cx="1346" cy="244" rx="60" ry="18" stroke="#60A5FA" stroke-width="8"/>
    <ellipse cx="1346" cy="244" rx="82" ry="24" transform="rotate(-24 1346 244)" stroke="#A78BFA" stroke-width="6" opacity="0.82"/>
    <circle cx="1390" cy="206" r="12" fill="#C4B5FD"/>
    <text x="1298" y="264" fill="#F8FBFF" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800">PX</text>
    <text x="1242" y="380" fill="#F8FBFF" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">Desktop checks</text>

    <rect x="1218" y="422" width="256" height="58" rx="20" fill="#111F3A"/>
    <circle cx="1250" cy="451" r="8" fill="#34D399"/>
    <text x="1272" y="458" fill="#F8FBFF" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Backend visible</text>

    <rect x="1218" y="498" width="256" height="58" rx="20" fill="#111F3A"/>
    <circle cx="1250" cy="527" r="8" fill="#60A5FA"/>
    <text x="1272" y="534" fill="#F8FBFF" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">AppImage ready</text>

    <rect x="1218" y="574" width="256" height="58" rx="20" fill="#111F3A"/>
    <circle cx="1250" cy="603" r="8" fill="#C084FC"/>
    <text x="1272" y="610" fill="#F8FBFF" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Deb package ready</text>

    <rect x="1218" y="650" width="256" height="86" rx="24" fill="#101C36"/>
    <text x="1244" y="692" fill="#DBEAFE" font-family="Segoe UI, Arial, sans-serif" font-size="21">Downloaded release?</text>
    <text x="1244" y="724" fill="#F8FBFF" font-family="Consolas, Menlo, monospace" font-size="18">./run-PhysicaX-linux.sh</text>
  </g>
</svg>
