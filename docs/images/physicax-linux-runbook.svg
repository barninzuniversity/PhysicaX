<svg width="1400" height="900" viewBox="0 0 1400 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="70" x2="1270" y2="830" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09111f"/>
      <stop offset="0.55" stop-color="#0f1f39"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="card" x1="200" y1="180" x2="1160" y2="770" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14263f"/>
      <stop offset="1" stop-color="#0b1628"/>
    </linearGradient>
    <linearGradient id="accent" x1="340" y1="260" x2="1080" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39a1ff"/>
      <stop offset="1" stop-color="#88f0c4"/>
    </linearGradient>
    <filter id="shadow" x="150" y="120" width="1100" height="680" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="26" stdDeviation="32" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1400" height="900" rx="40" fill="url(#bg)"/>
  <circle cx="1130" cy="140" r="180" fill="#1d4ed8" fill-opacity="0.14"/>
  <circle cx="260" cy="780" r="220" fill="#34d399" fill-opacity="0.12"/>
  <g filter="url(#shadow)">
    <rect x="170" y="132" width="1060" height="636" rx="34" fill="url(#card)" stroke="rgba(148,163,184,0.18)"/>
  </g>
  <text x="220" y="218" fill="#7dd3fc" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">PhysicaX Linux runbook</text>
  <text x="220" y="272" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800">One repo, five dependable launch paths</text>
  <text x="220" y="320" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="24">Use the root scripts to bootstrap, launch, verify, and escalate without memorizing package-specific commands.</text>

  <rect x="220" y="378" width="294" height="152" rx="24" fill="#0f1e34" stroke="#27476f"/>
  <text x="246" y="422" fill="#38bdf8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">01. Setup once</text>
  <text x="246" y="462" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800">setup-linux.sh</text>
  <text x="246" y="498" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="18">Creates the virtualenv, installs Python</text>
  <text x="246" y="524" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="18">requirements, and checks npm dependencies.</text>

  <rect x="554" y="378" width="294" height="152" rx="24" fill="#10233a" stroke="#285a73"/>
  <text x="580" y="422" fill="#67e8f9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">02. Web workspace</text>
  <text x="580" y="462" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800">run-web-linux.sh</text>
  <text x="580" y="498" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="18">Builds the standalone Next.js app</text>
  <text x="580" y="524" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="18">and serves it on port 3000.</text>

  <rect x="888" y="378" width="294" height="152" rx="24" fill="#112841" stroke="#2d637d"/>
  <text x="914" y="422" fill="#a7f3d0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">03. Desktop runtime</text>
  <text x="914" y="462" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="800">run-desktop-linux.sh</text>
  <text x="914" y="498" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="18">Runs the Linux doctor, prepares the</text>
  <text x="914" y="524" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="18">runtime, and opens Electron.</text>

  <path d="M514 454H554" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
  <path d="M848 454H888" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="534" cy="454" r="7" fill="#7dd3fc"/>
  <circle cx="868" cy="454" r="7" fill="#86efac"/>

  <rect x="220" y="572" width="452" height="146" rx="24" fill="#0d1a2e" stroke="#24435f"/>
  <text x="246" y="614" fill="#fde68a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">04. CFD backend only</text>
  <text x="246" y="654" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="800">run-cfd-backend-linux.sh</text>
  <text x="246" y="688" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="18">Starts the FastAPI backend directly on port 8000</text>
  <text x="246" y="712" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="18">for browser-driven CFD debugging and integration checks.</text>

  <rect x="706" y="572" width="476" height="146" rx="24" fill="#101c31" stroke="#34506f"/>
  <text x="732" y="614" fill="#fca5a5" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">05. Full Linux verification</text>
  <text x="732" y="654" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800">verify-linux.sh</text>
  <text x="732" y="688" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="18">Runs the doctor, prepares the runtime, smoke-tests the app,</text>
  <text x="732" y="712" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="18">and rebuilds the AppImage and Debian release bundle.</text>

  <text x="220" y="806" fill="#93c5fd" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Tip</text>
  <text x="270" y="806" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="22">If your folder path contains spaces, keep the quotes around the </text>
  <text x="926" y="806" fill="#f8fafc" font-family="Courier New, monospace" font-size="22">cd "/path/to/PhysicaX"</text>
  <text x="1196" y="806" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="22">command.</text>
</svg>
